[package]
name = "archipel-app"
description = "Standalone host for Archipel plugins: runs any Plugin as a desktop app on eframe and Archipel Kit."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
archipel-plugin-api.workspace = true
archipel-plugin-ui.workspace = true
directories = "6"
eframe.workspace = true
egui.workspace = true
keyring = "4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
# eframe's `wgpu` feature enables wgpu without any backend, which panics at startup
# ("no wgpu backend feature"). Enable the native ones; features unify with eframe's.
wgpu = { version = "27", default-features = false, features = ["vulkan", "gles", "metal", "dx12"] }

[dev-dependencies]
archipel-plugin-api = { workspace = true }

[lints]
workspace = true
