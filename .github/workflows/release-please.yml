name: Release

# Semantic releases from Conventional Commits. On every push to main,
# release-please opens or updates a release pull request that bumps
# [workspace.package] version in Cargo.toml and writes CHANGELOG.md. Merging it
# tags `v<version>` and publishes the GitHub release. Apps depend on the SDK by git tag
# `v<version>`.
on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT or GitHub App token in RELEASE_PLEASE_TOKEN lets CI run on the
          # release PR; GITHUB_TOKEN works but does not trigger other workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please does not know Cargo.lock; refresh the workspace members'
      # versions on the release PR branch.
      - name: Check out the release PR branch
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.release.outputs.prs_created == 'true'
      - name: Refresh Cargo.lock
        if: steps.release.outputs.prs_created == 'true'
        shell: bash
        run: |
          cargo update --workspace
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: update Cargo.lock for release"
            git push
          fi
