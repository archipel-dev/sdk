[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.91"
repository = "https://github.com/archipel-dev/sdk"

[workspace.dependencies]
archipel-command = { path = "crates/archipel-command" }
archipel-plugin-api = { path = "crates/archipel-plugin-api" }
archipel-plugin-ui = { path = "crates/archipel-plugin-ui" }
archipel-plugin-testing = { path = "crates/archipel-plugin-testing" }
archipel-sdk = { path = "crates/archipel-sdk" }
archipel-kit = { git = "https://github.com/archipel-dev/kit", branch = "main" }
egui = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
